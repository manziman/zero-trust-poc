name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source and unit tests
        run: make check

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Run end-to-end smoke test
        run: make demo

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose --profile demo --profile smoke ps --all
          docker compose --profile demo --profile smoke logs --no-color

      - name: Tear down test stack
        if: always()
        run: docker compose --profile demo --profile smoke down --volumes --remove-orphans
